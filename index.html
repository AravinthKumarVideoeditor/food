
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Calculator</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .calculator {
      width: 320px;
      padding: 20px;
      background: #222;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
    }

    #display {
      width: 100%;
      height: 70px;
      margin-bottom: 15px;
      padding: 15px;
      border: none;
      border-radius: 8px;
      background: #eee;
      color: #222;
      font-size: 30px;
      text-align: right;
      outline: none;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      height: 55px;
      border: none;
      border-radius: 8px;
      background: #444;
      color: white;
      font-size: 20px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #666;
    }

    .operator {
      background: #ff9800;
    }

    .operator:hover {
      background: #e68900;
    }

    .clear {
      background: #e53935;
    }

    .clear:hover {
      background: #c62828;
    }

    .equals {
      background: #2196f3;
      grid-row: span 2;
      height: 120px;
    }

    .equals:hover {
      background: #1976d2;
    }

    .zero {
      grid-column: span 2;
    }
  </style>
</head>

<body>
  <div class="calculator">
    <input
      type="text"
      id="display"
      value="0"
      readonly
      aria-label="Calculator display"
    >

    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">AC</button>
      <button onclick="deleteLast()">DEL</button>
      <button class="operator" onclick="chooseOperator('%')">%</button>
      <button class="operator" onclick="chooseOperator('/')">÷</button>

      <button onclick="appendNumber('7')">7</button>
      <button onclick="appendNumber('8')">8</button>
      <button onclick="appendNumber('9')">9</button>
      <button class="operator" onclick="chooseOperator('*')">×</button>

      <button onclick="appendNumber('4')">4</button>
      <button onclick="appendNumber('5')">5</button>
      <button onclick="appendNumber('6')">6</button>
      <button class="operator" onclick="chooseOperator('-')">−</button>

      <button onclick="appendNumber('1')">1</button>
      <button onclick="appendNumber('2')">2</button>
      <button onclick="appendNumber('3')">3</button>
      <button class="operator" onclick="chooseOperator('+')">+</button>

      <button onclick="appendNumber('0')" class="zero">0</button>
      <button onclick="appendNumber('.')">.</button>
      <button class="equals" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    const display = document.getElementById("display");

    let current = "0";
    let previous = null;
    let operator = null;
    let resetDisplay = false;

    function updateDisplay() {
      display.value = current;
    }

    function appendNumber(number) {
      if (resetDisplay) {
        current = number === "." ? "0." : number;
        resetDisplay = false;
      } else if (number === "." && current.includes(".")) {
        return;
      } else if (current === "0" && number !== ".") {
        current = number;
      } else if (current.length < 15) {
        current += number;
      }

      updateDisplay();
    }

    function chooseOperator(op) {
      if (operator !== null && !resetDisplay) {
        calculate();
      }

      previous = parseFloat(current);
      operator = op;
      resetDisplay = true;
    }

    function calculate() {
      if (operator === null || previous === null) return;

      const second = parseFloat(current);
      let result;

      switch (operator) {
        case "+":
          result = previous + second;
          break;
        case "-":
          result = previous - second;
          break;
        case "*":
          result = previous * second;
          break;
        case "/":
          if (second === 0) {
            current = "Cannot divide by zero";
            previous = null;
            operator = null;
            resetDisplay = true;
            updateDisplay();
            return;
          }
          result = previous / second;
          break;
        case "%":
          result = previous % second;
          break;
      }

      current = String(
        Number.isFinite(result)
          ? Number(result.toPrecision(12))
          : "Error"
      );

      previous = null;
      operator = null;
      resetDisplay = true;
      updateDisplay();
    }

    function clearDisplay() {
      current = "0";
      previous = null;
      operator = null;
      resetDisplay = false;
      updateDisplay();
    }

    function deleteLast() {
      if (resetDisplay || current.length === 1 ||
          current === "Cannot divide by zero" || current === "Error") {
        current = "0";
        resetDisplay = false;
      } else {
        current = current.slice(0, -1);
      }

      updateDisplay();
    }

    // Keyboard support
    document.addEventListener("keydown", function(event) {
      if (/^[0-9.]$/.test(event.key)) {
        appendNumber(event.key);
      } else if (["+", "-", "*", "/", "%"].includes(event.key)) {
        chooseOperator(event.key);
      } else if (event.key === "Enter" || event.key === "=") {
        calculate();
      } else if (event.key === "Backspace") {
        deleteLast();
      } else if (event.key === "Escape") {
        clearDisplay();
      }
    });
  </script>
</body>
</html>
